required:
  - rsync
properties:
  rsync:
    type: object
    properties:
      copy_results:
        type: boolean
        description: Enable copying of results with rsync
        default: false
      overwrite:
        type: boolean
        description: Overwrite existing results
        default: false
      large_file_threshold:
        type: string
        description: Files larger than this will be copied in a separate job (eg. 100M, 1 GB)
        default: "100M"
      timeout:
        type: integer
        description: Timeout (in seconds) for files to be available after rsync is complete
        default: 30
